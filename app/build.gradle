plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.nexbytes.bolap3'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.nexbytes.bolap3"
        minSdk 34
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                // Room exports each schema version here so migrations can be tested.
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            optimization {
                enable true
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    sourceSets {
        androidTest {
            assets.srcDirs += files("$projectDir/schemas")
        }
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.palette
    implementation libs.splashscreen
    implementation libs.media3.exoplayer
    implementation libs.media3.session
    implementation libs.media3.common

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    // lifecycle pins kotlinx-serialization 1.7.3, but room-testing (migration tests) needs 1.8.x;
    // test APKs reuse the app's versions, so align it here.
    implementation libs.kotlinx.serialization.core

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.auth
    implementation libs.firebase.firestore

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.room.testing
}
