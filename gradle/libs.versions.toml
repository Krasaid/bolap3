lifecycle = "2.11.0"
media3 = "1.11.1"
room = "2.8.5"
palette = "1.0.0"
splashscreen = "1.2.0"
firebaseBom = "35.0.2"
kotlinxSerialization = "1.8.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
